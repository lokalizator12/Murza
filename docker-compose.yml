version: '3.8'

services:
  mysql-db:
    image: mysql:8
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  murza-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: murza-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: ${MYSQL_DATABASE_URL_DOCKER}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      MAIL_SENDER_HOST: ${MAIL_SENDER_HOST}
      MAIL_SENDER_ACCESS_USERNAME: ${MAIL_SENDER_ACCESS_USERNAME}
      MAIL_SENDER_ACCESS_PASSWORD: ${MAIL_SENDER_ACCESS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TWILIO_SMS_SENDER_PHONE: ${TWILIO_SMS_SENDER_PHONE}
      TWILIO_SMS_SENDER_SID: ${TWILIO_SMS_SENDER_SID}
      TWILIO_SMS_SENDER_TOKEN: ${TWILIO_SMS_SENDER_TOKEN}
      REDIS_HOST: ${REDIS_HOST}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET}
    depends_on:
      - mysql-db
      - kafka
      - redis

  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_BROKER_ID: 1
    depends_on:
      - zookeeper



  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mysql_data:
    driver: local
