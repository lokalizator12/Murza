spring.application.name=Murza
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost}
cors.allowed.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
tinyurl.api.token=${TINYURL_API_TOKEN:}
crypting.secret-key=${SECRET_KEY}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://mongo:27017/murza}
spring.datasource.url=${MYSQL_DATABASE_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=always
server.port=8080

spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

credentials.super.admin.password=${SUPER_ADMIN_PASSWORD}
credentials.super.admin.email=${SUPER_ADMIN_EMAIL}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

verification-status.expiration-code=2
verification-status.block-duration-minutes=10

cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secretKey=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region=${AWS_REGION}
s3.bucket.name=${S3_BUCKET_NAME}

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=chat_group
spring.kafka.consumer.auto-offset-reset=earliest

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379

app.email.from=${MAIL_SENDER_ACCESS_USERNAME}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=${MAIL_SENDER_ACCESS_USERNAME}
spring.mail.password=${MAIL_SENDER_ACCESS_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

twilio.phone-number=${TWILIO_SMS_SENDER_PHONE}
twilio.account-sid=${TWILIO_SMS_SENDER_SID}
twilio.auth-token=${TWILIO_SMS_SENDER_TOKEN}

sms.verification.message=Your verification code is: %s

recaptcha.verify.url=https://www.google.com/recaptcha/api/siteverify
recaptcha.secret=${RECAPTCHA_SECRET}
